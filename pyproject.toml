[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnexp"
version = "0.1.0"
description = "Neural Networks for Symbolic Optimization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "wandb",
    "sympy",
    "skypilot[runpod]",
    "pytest",
]

[project.scripts]
generate-dataset = "nnexp.cli.generate_dataset:main"
sanity-check = "nnexp.cli.sanity_check:main"
